name: Daily streak
on:
  schedule:
    - cron: "0 12 * * *"   # 5:30 PM IST
  workflow_dispatch:

jobs:
  touch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p .streak
          echo "$(date -u +%Y-%m-%d)" >> .streak/log.txt
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily streak"
